<style>:root{--bg:#171717;--panel:#242424;--panel2:#2e2e2e;--orange:#d24b19;--cream:#d9ddc5;--muted:#a4a69a;--line:#b4b7a6;--max:1050px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--cream);font-family:Impact,"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-stretch:condensed;-webkit-font-smoothing:antialiased}a{color:inherit}button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}::selection{background:var(--orange);color:#fff}p{line-height:1.45}em{font-style:normal;color:var(--orange)}.orange{color:var(--orange)}.dim{color:var(--muted)}.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0)}.skip-link{position:fixed;left:8px;top:-60px;z-index:100;padding:12px;background:#fff;color:#000}.skip-link:focus{top:8px}
.header{height:106px;display:flex;justify-content:space-between;align-items:flex-start;max-width:1300px;margin:auto;padding:32px clamp(25px,5vw,65px) 12px;position:absolute;left:0;right:0;top:0;z-index:10}.header-home{height:100px}.brand{text-decoration:none;font-family:Impact,"Arial Black",sans-serif;font-weight:900;font-style:italic;color:var(--orange);font-size:34px;letter-spacing:-2px;line-height:1}.brand span{font-size:17px;color:var(--cream);letter-spacing:-.7px;display:block;margin-left:19px}.page-home .brand{visibility:hidden}.menu-button{border:0;background:none;padding:6px;display:flex;flex-direction:column;gap:8px;margin-left:auto}.menu-button span{height:5px;width:48px;background:var(--cream);display:block}.menu-button:hover span,.menu-button:focus-visible span{background:var(--orange)}.nav-overlay{position:fixed;inset:0;background:rgba(13,13,13,.97);z-index:40;transform:translateX(101%);transition:transform .25s ease;display:grid;place-items:center}.nav-overlay.is-open{transform:translateX(0)}.nav-open{overflow:hidden}.menu-close{position:absolute;right:clamp(22px,5vw,65px);top:20px;font:50px Arial,sans-serif;color:var(--cream);border:0;background:none}.nav-inner{width:min(82vw,470px);display:flex;flex-direction:column;gap:18px}.nav-inner>a{font-size:clamp(26px,3vw,39px);font-weight:900;text-transform:uppercase;text-decoration:none;line-height:1}.nav-inner>a:hover,.nav-inner>a[aria-current=page]{color:var(--orange)}.nav-caption{color:var(--orange);font-size:14px;letter-spacing:3px;margin-top:34px}
.home-hero{height:calc(100svh - 35px);min-height:650px;max-height:1300px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#171717}.home-logo{width:min(68vw,435px);height:auto;display:block;mix-blend-mode:lighten;position:relative;top:-4vh}.home-discover{position:absolute;bottom:17%;font-size:28px}.action-link{font-weight:900;font-size:25px;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px;transition:color .2s}.action-link:hover{color:var(--orange)}.site-footer{min-height:52px;background:#0f0f0f;padding:20px 24px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;font-size:12px;color:var(--orange);letter-spacing:.3px}.site-footer a{font-size:11px;color:var(--cream);text-decoration:none}
.section-container{width:min(calc(100% - 50px),var(--max));margin:auto;position:relative}.section-textured{background-image:linear-gradient(180deg,rgba(20,20,20,.7),rgba(20,20,20,.83)),url('/media/texture');background-size:cover,cover;background-position:center}.display-title{font-size:clamp(44px,7vw,89px);font-weight:900;letter-spacing:-1px;line-height:1.1;margin:0 0 28px}.copy-section{padding:150px 0 115px}.copy-section h2,.lead-section h2,.admin-page h2{font-size:clamp(30px,4.2vw,49px);margin:0 0 28px;line-height:1.2}.info-paragraph{font-family:Arial,Helvetica,sans-serif;font-size:clamp(17px,2vw,22px);line-height:1.65;max-width:900px}.section-actions{display:flex;justify-content:center;align-items:center;gap:70px;margin:70px 0 5px;flex-wrap:wrap}.section-actions .action-link{font-size:21px}

<script>(() => {
  const nav = document.getElementById('site-nav');
  const open = document.getElementById('menu-open');
  const close = document.getElementById('menu-close');
  function toggle(state) {
    if (!nav) return;
    nav.classList.toggle('is-open', state);
    nav.inert = !state;
    nav.setAttribute('aria-hidden', String(!state));
    open?.setAttribute('aria-expanded', String(state));
    document.body.classList.toggle('nav-open', state);
    if (state) close?.focus(); else open?.focus();
  }
  open?.addEventListener('click', () => toggle(true));
  close?.addEventListener('click', () => toggle(false));
  nav?.querySelectorAll('a').forEach(a => a.addEventListener('click', () => toggle(false)));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && nav?.classList.contains('is-open')) toggle(false); });
  document.querySelectorAll('.choose-service').forEach(btn => {
    btn.addEventListener('click', () => {
      const select = document.getElementById('selected-service');
      if (select) select.value = btn.dataset.service || '';
      document.getElementById('lead-form')?.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
  // Preserve the current service selection after form-validation issues.
})();

zxgsgmESeXIAECvEI3iVe50GHRakTmKds2lME56pceyBLyoI0gAAAA=\" width=\"424\"/>\n     <p class=\"newhome-brandline\"><strong>ТРЕНИРУЙСЯ</strong> С УМОМ</p>\n   </div>\n   <h1 class=\"newhome-lead\" id=\"home-headline\">ДУМАЙ <span class=\"outline\">БЫСТРЕЕ.</span><br><em>ИГРАЙ СИЛЬНЕЕ.</em></h1>\n   <p class=\"newhome-description\">Катание, техника владения клюшкой и игровое мышление. Не просто повторяй упражнения — научись понимать игру и принимать решения.</p>\n   <div class=\"newhome-actions\">\n     <a class=\"newhome-cta\" href=\"/sessions\"><span>ВЫБРАТЬ ТРЕНИРОВКУ</span><span class=\"arrow\" aria-hidden=\"true\">↗</span></a>\n     <a class=\"newhome-secondary\" href=\"/philosophy\">НАША ФИЛОСОФИЯ</a>\n   </div>\n  </div>\n  <div class=\"newhome-art\" aria-hidden=\"true\">\n    <div class=\"newhome-disc\"><div class=\"newhome-disc-center\">2R<span>READ THE GAME</span></div><div class=\"newhome-swipe\"></div><div class=\"newhome-marker\">ХОККЕЙНЫЙ IQ</div></div>\n  </div>\n </div>\n <div class=\"newhome-edge\">\n   <div class=\"newhome-tags\"><span>КАТАНИЕ</span><i></i><span>КЛЮШКА</span><i></i><span>ИГРОВОЕ МЫШЛЕНИЕ</span></div>\n   <a href=\"#approach\">ЛИСТАЙ ВНИЗ <span aria-hidden=\"true\">↓</span></a>\n </div>\n</section>\n<section class=\"newhome-section\" id=\"approach\" aria-labelledby=\"approach-title\">\n <div class=\"newhome-section-inner\">\n  <p class=\"newhome-kicker\">ПОДХОД 2R HOCKEY</p>\n  <h2 class=\"newhome-section-title\" id=\"approach-title\">ХОРОШИЙ ХОККЕИСТ — <em>НЕ ТОЛЬКО ТЕХНИКА.</em></h2>\n  <p class=\"newhome-section-subtitle\">Развиваем фундаментальные навыки и помогаем применять их в реальных игровых ситуациях. Работаем над тем, что действительно влияет на решения на льду.</p>\n  <div class=\"newhome-principles\">\n   <article class=\"newhome-principle\"><span class=\"num\">01 / ФУНДАМЕНТ</span><h3>КАТАНИЕ</h3><p>Контроль движения, баланс и уверенность на коньках — база для любого игрового действия.</p></article>\n   <article class=\"newhome-principle\"><span class=\"num\">02 / ИНСТРУМЕНТ</span><h3>РАБОТА С КЛЮШКОЙ</h3><p>Владение шайбой и точность действий в условиях скорости и давления.</p></article>\n   <article class=\"newhome-principle\"><span class=\"num\">03 / ПРЕИМУЩЕСТВО</span><h3>ИГРОВОЕ МЫШЛЕНИЕ</h3><p>Видеть варианты, читать эпизоды и выбирать решение до того, как закончится время.</p></article>\n  </div>\n </div>\n</section>\n<section class=\"newhome-section newhome-programs\" aria-labelledby=\"training-title\">\n <div class=\"newhome-section-inner\">\n  <p class=\"newhome-kicker\">НАПРАВЛЕНИЯ ПОДГОТОВКИ</p>\n  <h2 class=\"newhome-section-title\" id=\"training-title\">ТВОЯ ИГРА. <em>ТВОЙ ПРОГРЕСС.</em></h2>\n  <p class=\"newhome-section-subtitle\">Выбери формат, который подходит твоей задаче. Подробности и заявка — в разделе тренировок.</p>\n  <div class=\"newhome-program-grid\">\n   <a href=\"/sessions\" class=\"newhome-program-card\"><span class=\"newhome-program-label\">01 / НА ЛЬДУ</span><h3>ИНДИВИДУАЛЬНО<br>И В ГРУППЕ</h3><p>Катание, владение клюшкой и игровые упражнения.</p><span class=\"newhome-program-go\" aria-hidden=\"true\">↗</span></a>\n   <a href=\"/sessions\" class=\"newhome-program-card\"><span class=\"newhome-program-label\">02 / ПОДГОТОВКА И РАЗБОР</span><h3>ОФП / СФП<br>И АНАЛИЗ ИГРЫ</h3><p>Работа над физической базой и пониманием игровых эпизодов.</p><span class=\"newhome-program-go\" aria-hidden=\"true\">↗</span></a>\n  </div>\n </div>\n</section>\n<section class=\"newhome-final\" aria-label=\"Запись на тренировку\">\n <p>ГОТОВ РАБОТАТЬ НАД СВОЕЙ ИГРОЙ?</p>\n <h2 class=\"newhome-section-title\">НАЧНИ С <em style=\"color:#f3eadc\">ПЕРВОГО ШАГА.</em></h2>\n <a href=\"/sessions\" class=\"newhome-cta\"><span>ПЕРЕЙТИ К ТРЕНИРОВКАМ</span><span class=\"arrow\" aria-hidden=\"true\">↗</span></a>\n</section>\n","about":"\n<section aria-labelledby=\"about-title\" class=\"about-hero section-textured\">\n<div class=\"about-content\">\n<h1 class=\"display-title orange\" id=\"about </h1>\n<p class=\"big-statement\">Обычный хоккеист — катание, дриблинг, передачи, броски. Хороший хоккеист — обычный хоккеист + МОЗГ.</p>\n<div class=\"thoughts\">\n<article><div aria-hidden=\"true\" class=\"thought-icon\">01</div><p><span class=\"orange\">КАТАНИЕ</span> — основной инструмент хоккеиста. Совершенствование катания — постоянный процесс, независимо от уровня игрока.</p></article>\n<article><div aria-hidden=\"true\" class=\"thought-icon\">02</div><p>Владение клюшкой и контроль шайбы развиваем <span class=\"orange\">в игровых ситуациях</span>, а не изолированно от игры.</p></article>\n<article><div aria-hidden=\"true\" class=\"thought-icon\">03</div><p>Разбор игр помогает выявить сильные стороны, недочёты и <span class=\"orange\">варианты решений</span> на площадке.</p></article>\n</div>\n<div aria-label=\"Схема хоккейной площадки с игровыми траекториями\" class=\"rink-card\" role=\"img\">\n<svg aria-hidden=\"true\" viewbox=\"0 0 520 320\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#d9dec9\" height=\"292\" rx=\"35\" stroke=\"#151515\" stroke-width=\"12\" width=\"492\" x=\"14\" y=\"14\"></rect>\n<path d=\"M155 17V303M365 17V303\" stroke=\"#171717\" stroke-width=\"5\"></path>\n<circle cx=\"260\" cy=\"91\" fill=\"none\" r=\"47\" stroke=\"#171717\" stroke-width=\"5\"></circle><circle cx=\"260\" cy=\"229\" fill=\"none\" r=\"47\" stroke=\"#171717\" stroke-width=\"5\"></circle>\n<circle cx=\"260\" cy=\"91\" fill=\"#171717\" r=\"5\"></circle><circle cx=\"260\" cy=\"229\" fill=\"#171717\" r=\"5\"></circle>\n<path d=\"M80 252C146 265 183 253 233 235S318 166 370 146\" fill=\"none\" stroke=\"#cb491b\" stroke-linecap=\"round\" stroke-width=\"10\"></path>\n<path d=\"M345 136l28 8-10 29M212 216l25 18-10 26\" fill=\"none\" stroke=\"#cb491b\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"10\"></path>\n<path d=\"M315 248C399 287 433 247 438 182\" fill=\"none\" stroke=\"#cb491b\" stroke-dasharray=\"14 18\" stroke-width=\"9\"></path>\n<path d=\"M423 202l16-28 15 27\" fill=\"none\" stroke=\"#cb491b\" stroke-linecap=\"round\" stroke-width=\"9\"></path>\n<text fill=\"#cb491b\" font-family=\"Arial\" font-size=\"48\" font-weight=\"900\" x=\"47\" y=\"252\">×</text>\n</svg>\n</div>\n<div class=\"comparison\">\n<div><h2>ОБЫЧНЫЙ ХОККЕИСТ</h2><p>Готов действовать по 2–3 сценариям в игровом эпизоде, принимает простые и предсказуемые решения.</p></div>\n<div><h2 class=\"orange\">ХОРОШИЙ ХОККЕИСТ</h2><p>Действует креативно: рассматривает больше вариантов и находит подходящее решение в конкретной ситуации.</p></div>\n</div>\n<div class=\"section-actions\"><a class=\"action-link\" href=\"/sessions\">ЗАПИСАТЬСЯ</a><a class=\"action-link\" href=\"/about\">ДАЛЕЕ &gt;</a></div>\n</div>\n</section>\n","sessions":"\n<section class=\"sessions-intro section-textured\"><div class=\"section-container\">\n<h1 class=\"display-title orange\">ЗАПИСАТЬСЯ</h1>\n<p class=\"orange-line\"></p>\n<p class=\"sessions-description\">Хоккейные тренировки проходят один на один с тренером и в мини-группах по уровню подготовки игроков.</p>\n</div></section>\n<section class=\"services\"><div class=\"section-container\">\n<div class=\"accordion\" id=\"services-accordion\">\n<details class=\"service\">\n<summary><span>ОДИН НА ОДИН С ТРЕНЕРОМ</span><span aria-hidden=\"true\" class=\"plus\">+</span></summary>\n<div class=\"service-body\"><p>Индивидуальные тренировки с учётом уровня, техники и игровых задач.</p><p class=\"dim\">Занятия на льду</p><p class=\"service-price\">от 4 000 ₽</p>\n<button class=\"outline-button choose-service\" data-service=\"individual\" type=\"button\">ОСТАВИТЬ ЗАЯВКУ</button></div>\n</details>\n<details class=\"service\">\n<summary><span>ГРУППА ОТ 2-Х ИГРОКОВ</span><span aria-hidden=\"true\" class=\"plus\">+</span></summary>\n<div class=\"service-body\"><p>Занятия в мини-группе с подбором по уровню подготовки.</p><p class=\"dim\">Занятия на льду</p><p class=\"service-price\">от 3 000 ₽</p>\n<button class=\"outline-button choose-service\" data-service=\"group\" type=\"button\">ОСТАВИТЬ ЗАЯВКУ</button></div>\n</details>\n<details class=\"service\">\n<summary><span>ОФП / СФП</span><span aria-hidden=\"true\" class=\"plus\">+</span></summary>\n<div class=\"service-body\"><p>Общая и специальная физическая подготовка хоккеиста.</p><p class=\"dim\">Занятия в зале</p><p class=\"service-price\">от 2 000 ₽</p>\n<button class=\"outline-button choose-service\" data-service=\"fitness\" type=\"button\">ОСТАВИТЬ ЗАЯВКУ</button></div>\n</details>\n<details class=\"service\">\n<summary><span>АНАЛИЗ ИГРЫ</span><span aria-hidden=\"true\" class=\"plus\">+</span></summary>\n<div class=\"service-body\"><p>Разбор игровых ситуаций и индивидуальные рекомендации.</p><p class=\"dim\">Аудио / видео разборы</p><p class=\"service-price\">от 3 000 ₽</p>\n<button class=\"outline-button choose-service\" data-service=\"analysis\" type=\"button\">ОСТАВИТЬ ЗАЯВКУ</button></div>\n</details>\n<details class=\"service\">\n<summary><span>КЭМП ИГРОКОВ</span><span aria-hidden=\"true\" class=\"plus\">+</span></summary>\n<div class=\"service-body\"><p>Комплексная программа сборов. Даты и места уточняются.</p><p class=\"dim\">Стоимость участия</p><p class=\"service-price\">от 30 000 ₽</p>\n<a class=\"action-link\" href=\"/camp\">ПОДРОБНЕЕ</a>\n<button class=\"outline-button choose-service\" data-service=\"camp\" type=\"button\">ОСТАВИТЬ ЗАЯВКУ</button></div>\n</details>\n</div>\n<p class=\"service-note\">Все занятия на льду и в зале проходят в Москве. Анализ игроков проводится онлайн, через Zoom, либо в виде записи игры с разбором ошибок и комментариями к схемам.</p>\n</div></section>\n<section class=\"lead-section\" id=\"lead-form\"><div class=\"section-container\">\n<h2>ФОРМА <span class=\"orange\">ОБРАТНОЙ СВЯЗИ</span></h2>\n<form action=\"/apply\" class=\"lead-form\" method=\"post\">\n<input name=\"csrf_token\" type=\"hidden\" value=\"7P_mBx8W-7VugdBZ8iDgUmxT_7ApAvwdQ_HyBwvIPLo\"/>\n<div aria-hidden=\"true\" class=\"honey\"><labe function routeTo(path, push=true) {
  const [route,hash] = (path||'/').split('#');
  const key=(route||'/').replace(/^\//,'') || 'home';
  if(!Object.prototype.hasOwnProperty.call(pages,key))return false;
  document.getElementById('main').innerHTML=pages[key];
  document.body.className='page-'+key;
  document.querySelector('header')?.classList.toggle('header-home',key==='home');
  document.getElementById('preview-fab')?.classList.toggle('is-hidden',key==='home');
  document.querySelectorAll('#site-nav a').forEach(a => {a.removeAttribute('aria-current');if(a.getAttribute('href')===(key==='home'?'/':'/'+key))a.setAttribute('aria-current','page')});
  document.title=(key==='home'?'2R Hockey':'2R Hockey • '+({about:'Обо мне',philosophy:'Философия',sessions:'Записаться',camp:'Про кэмп',privacy:'Конфиденциальность'}[key]||''));
  document.querySelectorAll('.choose-service').forEach(btn=>btn.addEventListener('click',()=>{const select=document.getElementById('selected-service');if(select)select.value=btn.dataset.service||'';document.getElementById('lead-form')?.scrollIntoView({behavior:'smooth'});}));
  document.querySelectorAll('.lead-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();alert('Это предварительный просмотр. Данные не отправлены. После запуска на сервере заявки будут сохраняться в базе.');}));
  if(push && location.protocol!=='file:')history.pushState({page:key},'',(key==='home'?'/':'/'+key)+(hash?'#'+hash:''));
  if(hash){setTimeout(()=>document.getElementById(hash)?.scrollIntoView({behavior:'smooth'}),40)}else{window.scrollTo({top:0,behavior:'instant'})}
  return true;
}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;let href=a.getAttribute('href');if(!href||!href.startsWith('/')||href.startsWith('//'))return; if(routeTo(href,true)){e.preventDefault();const nav=document.getElementById('site-nav');nav.classList.remove('is-open');nav.inert=true;nav.setAttribute('aria-hidden','true');document.body.classList.remove('nav-open');document.getElementById('menu-open')?.setAttribute('aria-expanded','false');}});
window.addEventListener('popstate',()=>routeTo(location.pathname+location.hash,false));
routeTo(location.protocol==='file:'?'/':(location.pathname==='/' && new URLSearchParams(location.search).has('page') ? '/'+new URLSearchParams(location.search).get('page') : location.pathname)+location.hash,false);
